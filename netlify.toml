[build]
  publish = "public"
  command = "echo 'Static iCal files — pre-generated by sync.js'"

[[headers]]
  for = "/*.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/index.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
