name: Sync WP Blocks to iCal

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub minimum)
  workflow_dispatch:

jobs:
  sync-blocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Patch iCal files with WP blocks
        run: node sync-blocks.js
        env:
          WP_URL: https://bluekeys.co
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

      - name: Commit if changed
        run: |
          git config user.name  "blocks-sync[bot]"
          git config user.email "blocks-sync@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update WP blocks $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Robust push: this workflow and sync.yml run concurrently and both push.
          # Retry, integrating remote each time and preferring our freshly-built feeds.
          for i in 1 2 3 4 5; do
            git push && { echo "Pushed (attempt $i)."; exit 0; }
            echo "Push rejected; integrating remote and retrying ($i)..."
            git fetch origin main
            git merge -X ours --no-edit origin/main || true
          done
          echo "ERROR: push failed after 5 attempts"; exit 1

      - name: Trigger Kixedo sync every ~15 min (every 3rd run of this workflow)
        run: |
          MINUTE=$(date -u +%M)
          # Run at minutes :00, :15, :30, :45 (when minute is divisible by 15)
          if [ $((10#$MINUTE % 15)) -lt 5 ]; then
            echo "Triggering Kixedo sync..."
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/dispatches" \
              -d '{"event_type":"trigger-kixedo-sync"}'
          else
            echo "Skipping Kixedo trigger this run (minute: $MINUTE)"
          fi
