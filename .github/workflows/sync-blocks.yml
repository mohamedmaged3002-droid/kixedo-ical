name: Sync WP Blocks to iCal

on:
  schedule:
    - cron: '*/5 * * * *'   # every 5 minutes (GitHub minimum)
  workflow_dispatch:

jobs:
  sync-blocks:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Patch iCal files with WP blocks
        run: node sync-blocks.js

      - name: Commit if changed
        run: |
          git config user.name  "blocks-sync[bot]"
          git config user.email "blocks-sync@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: update WP blocks $(date -u '+%Y-%m-%d %H:%M UTC')" && git push)
