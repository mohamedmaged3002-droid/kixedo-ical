name: Sync Kixedo iCal

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes
  workflow_dispatch:          # manual trigger from GitHub UI
  repository_dispatch:
    types: [trigger-kixedo-sync]  # called by sync-blocks every 3rd run (~15 min)

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run sync
        env:
          KIXEDO_EMAIL:    ${{ secrets.KIXEDO_EMAIL }}
          KIXEDO_PASSWORD: ${{ secrets.KIXEDO_PASSWORD }}
          WP_URL:          https://bluekeys.co
          WP_USERNAME:     ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: node sync.js

      - name: Commit updated .ics files
        run: |
          git config user.name  "kixedo-sync[bot]"
          git config user.email "kixedo-sync@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: sync ical $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Robust push: sync.yml and sync-blocks.yml run concurrently and both push.
          # Retry, integrating remote each time and preferring our freshly-built feeds.
          for i in 1 2 3 4 5; do
            git push && { echo "Pushed (attempt $i)."; exit 0; }
            echo "Push rejected; integrating remote and retrying ($i)..."
            git fetch origin main
            git merge -X ours --no-edit origin/main || true
          done
          echo "ERROR: push failed after 5 attempts"; exit 1

      - name: Trigger WP Rentals iCal re-import on bluekeys.co
        run: |
          curl -s -X POST \
            -u "${{ secrets.WP_USERNAME }}:${{ secrets.WP_APP_PASSWORD }}" \
            "https://bluekeys.co/wp-json/mynt/v1/trigger-ical-import" \
            | cat
