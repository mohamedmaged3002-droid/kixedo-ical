name: Sync Kixedo iCal

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run sync
        env:
          KIXEDO_EMAIL:    ${{ secrets.KIXEDO_EMAIL }}
          KIXEDO_PASSWORD: ${{ secrets.KIXEDO_PASSWORD }}
        run: node sync.js

      - name: Commit updated .ics files
        run: |
          git config user.name  "kixedo-sync[bot]"
          git config user.email "kixedo-sync@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: sync ical $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
