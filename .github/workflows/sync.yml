name: Sync Kixedo iCal

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:          # manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Run sync
        env:
          KIXEDO_EMAIL:    ${{ secrets.KIXEDO_EMAIL }}
          KIXEDO_PASSWORD: ${{ secrets.KIXEDO_PASSWORD }}
        run: node sync.js

      - name: Deploy to Netlify
        run: |
          cd public && zip -r ../deploy.zip . && cd ..
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.NETLIFY_AUTH_TOKEN }}" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip \
            "https://api.netlify.com/api/v1/sites/${{ secrets.NETLIFY_SITE_ID }}/deploys" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Deploy ID:', d.get('id'), '| State:', d.get('state'))"

      - name: Commit updated .ics files
        run: |
          git config user.name  "kixedo-sync[bot]"
          git config user.email "kixedo-sync@users.noreply.github.com"
          git add public/
          git diff --cached --quiet && echo "No changes" || git commit -m "chore: sync ical $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
